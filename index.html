<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extractor de tickets y móviles</title>
<style>
:root{
  --fondo:#eef1f4; --papel:#fff; --tinta:#1b2530; --suave:#5d6b7a;
  --borde:#cbd3dc; --acento:#0e6b5c; --acento-h:#0a5448; --aviso:#9a5b00;
}
@media (prefers-color-scheme:dark){
  :root{--fondo:#12181f; --papel:#1b242d; --tinta:#e6ebf0; --suave:#92a1b0;
        --borde:#33414f; --acento:#3fb8a1; --acento-h:#5cd0ba; --aviso:#e0a64a;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.5rem;margin:0 0 6px}
.intro{margin:0 0 22px;color:var(--suave)}
label{display:block;font-weight:600;margin:16px 0 6px}
textarea{width:100%;padding:12px;border:1px solid var(--borde);border-radius:8px;
  background:var(--papel);color:var(--tinta);font:inherit;resize:vertical}
#salida{font-family:Consolas,"SF Mono",monospace;font-size:.95rem}
textarea:focus,button:focus-visible{outline:3px solid var(--acento);outline-offset:1px}
.acciones{display:flex;gap:10px;margin-top:12px}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.primario{background:var(--acento);color:#fff}
.primario:hover:not(:disabled){background:var(--acento-h)}
.primario:disabled{opacity:.5;cursor:not-allowed}
.secundario{background:transparent;color:var(--tinta);border-color:var(--borde)}
.secundario:hover{background:var(--papel)}
#btnCopiar{margin-top:12px}
.estado{min-height:1.5em;margin:12px 0 0;color:var(--suave)}
.estado.aviso{color:var(--aviso)}
</style>
</head>
<body>
<main>
  <h1>Extractor de tickets y móviles</h1>
  <p class="intro">Pega los mensajes copiados de WhatsApp. Se extrae el número de ticket y el ID del móvil de cada mensaje.</p>

  <label for="entrada">Mensajes de WhatsApp</label>
  <textarea id="entrada" rows="10" placeholder="[3/10, 7:23 a. m.] Mesa Progresos: 22740779 EN PROGRESO OK&#10;ID Móvil: 674128&#10;Gestiona: MSNA"></textarea>

  <div class="acciones">
    <button id="btnExtraer" class="primario">Extraer datos</button>
    <button id="btnLimpiar" class="secundario">Limpiar</button>
  </div>

  <p id="estado" class="estado" role="status"></p>

  <label for="salida">Resultado para copiar</label>
  <textarea id="salida" rows="8" readonly placeholder="El resultado aparecerá aquí"></textarea>

  <button id="btnCopiar" class="primario" disabled>Copiar resultado</button>
</main>
<script>
const entrada = document.getElementById('entrada');
const salida = document.getElementById('salida');
const estado = document.getElementById('estado');
const btnCopiar = document.getElementById('btnCopiar');

// Encabezado de mensaje de WhatsApp: "[10:32, 2/10/2026] Nombre:" o "2/10/26, 10:32 - Nombre:"
const ENCABEZADO = /^\s*(?:\[\s*\d{1,2}[\/.\-]\d{1,2}(?:[\/.\-]\d{2,4})?,?\s+\d{1,2}:\d{2}[^\]]*\]|\[\s*\d{1,2}:\d{2}[^\]]*\]|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4},?\s+\d{1,2}:\d{2}\s+-)/;

// Ticket: "Ticket 12345", "Ticket N° 12345", "TK-12345", "Caso: 12345", "INC123456", "#12345"
const RE_TICKET = /(?:ticket|tkt|tk|caso|incidente|inc|ref)\s*(?:n[°ºo.]*|no\.?|#|id)?\s*[:\-#]?\s*([A-Za-z]{0,4}-?\d{3,})|#(\d{3,})/i;

// Móvil: "Móvil 123", "Movil: 45", "ID móvil 678", "Unidad 12", "Interno 5"
const RE_MOVIL = /(?:id\s*)?(?:m[oó]vil|movil|unidad|interno)\s*(?:n[°ºo.]*|no\.?|#|id)?\s*[:\-#]?\s*([A-Za-z]{0,3}-?\d{1,6}[A-Za-z]?)/i;

function dividirMensajes(texto) {
  const lineas = texto.split(/\r?\n/);
  const hayEncabezados = lineas.some(l => ENCABEZADO.test(l));
  const mensajes = [];

  if (hayEncabezados) {
    let actual = null;
    for (const l of lineas) {
      if (ENCABEZADO.test(l)) {
        if (actual !== null) mensajes.push(actual);
        actual = l;
      } else if (actual !== null) {
        actual += '\n' + l;
      }
    }
    if (actual !== null) mensajes.push(actual);
  } else {
    mensajes.push(...texto.split(/\n\s*\n/));
  }
  return mensajes.filter(m => m.trim());
}

function extraer(mensaje) {
  // Quitar el encabezado "[3/10, 7:23 a. m.]" para que la hora no se confunda con datos
  const cuerpo = mensaje.replace(/^\s*(?:\[[^\]]*\]|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4},?\s+\d{1,2}:\d{2}[^-]*-)/, '');

  const m = cuerpo.match(RE_MOVIL);
  const movil = m ? m[1] : null;

  let ticket = null;
  const t = cuerpo.match(RE_TICKET);
  if (t) {
    ticket = t[1] || t[2];
  } else {
    // Sin palabra clave: primer número largo que no sea el ID del móvil
    const sinMovil = m ? cuerpo.replace(m[0], ' ') : cuerpo;
    const n = sinMovil.match(/\b\d{6,}\b/);
    ticket = n ? n[0] : null;
  }
  return { ticket, movil };
}

function procesar() {
  const texto = entrada.value.trim();
  estado.className = 'estado';

  if (!texto) {
    salida.value = '';
    estado.textContent = '';
    btnCopiar.disabled = true;
    return;
  }

  const datos = dividirMensajes(texto).map(extraer)
    .filter(d => d.ticket || d.movil);

  if (!datos.length) {
    salida.value = '';
    btnCopiar.disabled = true;
    estado.className = 'estado aviso';
    estado.textContent = 'No se encontró ningún ticket ni móvil. Revisa que los mensajes los incluyan.';
    return;
  }

  salida.value = datos
    .map(d => `${d.ticket || 'SIN TICKET'}  ID ${d.movil || 'SIN ID'}`)
    .join('\n');
  btnCopiar.disabled = false;

  const incompletos = datos.filter(d => !d.ticket || !d.movil).length;
  if (incompletos) {
    estado.className = 'estado aviso';
    estado.textContent = `${datos.length} mensajes procesados. ${incompletos} con datos faltantes (marcados SIN TICKET / SIN ID).`;
  } else {
    estado.textContent = `${datos.length} mensajes procesados.`;
  }
}

async function copiar() {
  try {
    await navigator.clipboard.writeText(salida.value);
  } catch {
    salida.select();
    document.execCommand('copy');
  }
  const original = btnCopiar.textContent;
  btnCopiar.textContent = 'Copiado';
  setTimeout(() => (btnCopiar.textContent = original), 1500);
}

document.getElementById('btnExtraer').addEventListener('click', procesar);
entrada.addEventListener('input', procesar);
btnCopiar.addEventListener('click', copiar);
document.getElementById('btnLimpiar').addEventListener('click', () => {
  entrada.value = '';
  procesar();
  entrada.focus();
});
</script>
</body>
</html>
